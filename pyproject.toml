[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sala-crystal"
version = "1.0.0"
description = "Symmetry-constrained flow matching for molecular crystal generation"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "networkx>=3.0,<4",
  "torch>=2.2,<3",
  "hydra-core>=1.3,<1.4",
  "omegaconf>=2.3,<2.4",
  "pytorch-lightning>=2.2,<3",
  "tensorboard>=2.12,<3",
  "pymatgen>=2023.8",
  "spglib>=2.5,<3",
  "PyYAML>=6.0,<7",
  "tqdm>=4.65,<5",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16"]
inference = ["rdkit>=2024.3", "huggingface-hub>=0.26,<3"]

[project.urls]
Homepage = "https://wendi-cai.github.io/SALA/"
Repository = "https://github.com/WENDI-CAI/SALA"
Models = "https://huggingface.co/cWendi/SALA"
Issues = "https://github.com/WENDI-CAI/SALA/issues"

[project.scripts]
sala-preprocess = "sala.data.preprocessing:main"
sala-train = "sala.training.cli:main"
sala-generate = "sala.generation.cli:main"
sala-predict = "sala.predict:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sala", "sala.*", "conf"]
namespaces = false

[tool.setuptools.package-data]
conf = ["*.yaml", "*/*.yaml"]
