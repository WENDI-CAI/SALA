[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sala-architecture"
version = "0.1.0"
description = "Minimal SALA full-cell Crystal DiT architecture with explicit symmetry and constrained lattices"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["torch>=2.13,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.urls]
Homepage = "https://wendi-cai.github.io/SALA/"
Repository = "https://github.com/WENDI-CAI/SALA"
Paper = "https://arxiv.org/pdf/2609.34690"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["sala", "sala.core", "sala.models", "sala.models.crystal_dit"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"
