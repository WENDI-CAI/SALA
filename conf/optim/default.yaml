# Hybrid Muon/AdamW optimizer.
optimizer: hybrid_muon
lr: 2.5e-05
weight_decay: 0.0
lr_scheduler:
  type: cosine_warmup
  min_lr_ratio: 0.05
warmup_steps: 3000
muon:
  backend: internal
  lr: 5.0e-05
  momentum: 0.95
  nesterov: true
  ns_steps: 5
  weight_decay: 0.0
  min_dim: 128
  max_aspect_ratio: 8.0
  adamw_betas:
  - 0.9
  - 0.95
  adamw_eps: 1.0e-08
  adjust_lr_fn: match_rms_adamw
